<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="vG Store">
  <title>vG Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="vG Home">vG</a>
    <nav>
      <a href="#home">Game</a>
      <a href="#account">Account</a>
    </nav>
  </header>

  <main>
    <!-- SCREEN 1: HOME -->
    <section id="home" class="screen home-screen">
      <div class="store-title">vG Store</div>

      <div class="game-list">
        <button class="game-button" data-game="Game VIP Arena of Valor x64">
          VIP Arena of Valor x64
        </button>
        <button class="game-button" data-game="VIP Clash of Titans x64">
          VIP Clash of Titans x64
        </button>
        <button class="game-button" data-game="VIP Garena Aov x64">
          VIP Garena Aov x64
        </button>
        <button class="game-button" data-game="VIP Garena Rov x64">
          VIP Garena Rov x64
        </button>
      </div>
    </section>

    <!-- SCREEN 2: BUY -->
    <section id="buy" class="screen buy-screen hidden">
      <button id="backButton" class="back-button">← Back</button>

      <div class="buy-card">
        <div class="small-label">GAME</div>
        <h1 id="gameTitle">Game VIP Arena of Valor x64</h1>

        <div id="plans" class="plans">
          <article class="plan-card">
            <div class="plan-name">30 Days</div>
            <div class="price">$1.99</div>
            <button class="buy-button" data-plan="30 Days" data-price="1.99">
              BUY
            </button>
          </article>

          <article class="plan-card">
            <div class="plan-name">90 Days</div>
            <div class="price">$3.99</div>
            <button class="buy-button" data-plan="90 Days" data-price="3.99">
              BUY
            </button>
          </article>
        </div>

        <p id="notReady" class="not-ready hidden">
          This game is not available for purchase yet.
        </p>
      </div>
    </section>

    <!-- ACCOUNT -->
    <section id="account" class="account-screen hidden">
      <div class="account-card">
        <h2>Account</h2>
        <div class="account-row"><span>Status</span><strong id="accountStatus">Not purchased</strong></div>
        <div class="account-row"><span>Game</span><strong id="accountGame">—</strong></div>
        <div class="account-row"><span>Plan</span><strong id="accountPlan">—</strong></div>
        <div class="account-row"><span>Expires</span><strong id="accountExpiry">—</strong></div>
        <button id="accountBack" class="secondary-button">Back to Game</button>
      </div>
    </section>
  </main>

  <footer>© 2026 vG</footer>

  <!-- DEMO CHECKOUT -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button id="closeModal" class="close" aria-label="Close">×</button>
      <div class="modal-brand">vG</div>
      <h2>Confirm Purchase</h2>
      <p id="modalText"></p>
      <button id="demoPay" class="modal-button">Continue</button>
      <div class="demo-note">Demo checkout — no real payment is charged.</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
