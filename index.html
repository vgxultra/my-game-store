<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="vG Store">
  <title>vG Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="brand" onclick="showHome()">vG</div>

  <nav>
    <button onclick="showHome()">Game</button>
    <button onclick="showAccount()">Account</button>
  </nav>
</header>


<main>

  <!-- HOME -->
  <section id="homeScreen">

    <div class="hero">
      <div class="store-title">vG Store</div>
      <p>Choose your game</p>
    </div>

    <div class="game-list">

      <button class="game-card" onclick="openGame('Arena of Valor')">
        <span>VIP Arena of Valor x64</span>
        <strong>VIEW</strong>
      </button>

      <button class="game-card" onclick="openGame('Clash of Titans')">
        <span>VIP Clash of Titans x64</span>
        <strong>VIEW</strong>
      </button>

      <button class="game-card" onclick="openGame('Garena Aov')">
        <span>VIP Garena Aov x64</span>
        <strong>VIEW</strong>
      </button>

      <button class="game-card" onclick="openGame('Garena Rov')">
        <span>VIP Garena Rov x64</span>
        <strong>VIEW</strong>
      </button>

    </div>

  </section>


  <!-- BUY SCREEN -->
  <section id="buyScreen" class="hidden">

    <button class="back-button" onclick="showHome()">← Back</button>

    <div class="buy-header">
      <div class="buy-brand">vG</div>
      <h1 id="gameTitle">Game VIP Arena of Valor x64</h1>
      <p>Choose your plan</p>
    </div>


    <div id="plans">

      <div class="plan-card">
        <div class="plan-name">30 Days</div>
        <div class="price">$1.99</div>

        <button class="buy-button" onclick="demoBuy('30 Days', '1.99')">
          BUY
        </button>
      </div>


      <div class="plan-card">
        <div class="plan-name">90 Days</div>
        <div class="price">$3.99</div>

        <button class="buy-button" onclick="demoBuy('90 Days', '3.99')">
          BUY
        </button>
      </div>

    </div>

  </section>


  <!-- ACCOUNT -->
  <section id="accountScreen" class="hidden">

    <div class="account-header">
      <div class="buy-brand">vG</div>
      <h1>Account</h1>
    </div>

    <div class="account-card">

      <div class="account-row">
        <span>Status</span>
        <strong id="accountStatus">Not purchased</strong>
      </div>

      <div class="account-row">
        <span>Game</span>
        <strong id="accountGame">—</strong>
      </div>

      <div class="account-row">
        <span>Plan</span>
        <strong id="accountPlan">—</strong>
      </div>

      <div class="account-row">
        <span>Expires</span>
        <strong id="accountExpiry">—</strong>
      </div>

      <button id="downloadButton" class="download-button" disabled>
        Download APK
      </button>

    </div>

  </section>

</main>


<footer>
  © 2026 vG
</footer>


<!-- DEMO CHECKOUT -->
<div id="modal" class="modal hidden">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">×</button>

    <div class="modal-icon">💳</div>

    <h2>Purchase</h2>

    <p id="modalText"></p>

    <button class="modal-button" onclick="confirmPurchase()">
      Continue
    </button>

    <div class="demo-warning">
      Demo checkout — no real money is charged.
    </div>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
